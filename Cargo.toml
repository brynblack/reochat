[package]
name = "reochat"
version = "0.1.0"
edition = "2024"
authors = ["Brynley Llewellyn-Roux"]
description = "A Matrix client written in Rust."
repository = "https://github.com/brynblack/reochat"
license = "MIT"

[dependencies]
anyhow = "1.0.102"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "env"] }
env_logger = "0.11.10"
iced = { version = "0.14.0", features = ["advanced", "svg", "tokio"] }
log = "0.4.29"
matrix-sdk = "0.17.0"
matrix-sdk-ui = "0.17.0"
rand = "0.10.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["fs", "sync"] }
